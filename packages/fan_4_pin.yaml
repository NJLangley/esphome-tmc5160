esphome:
  name: ${device_name}

globals:
  - id: dhttemp
    type: float
    restore_value: yes
    initial_value: '0'

#########################
# ESP32 AND NETWORK SETUP

esp32:
  board: esp32dev

api:


sensor:
  # RPM Signal from Fan
  - platform: pulse_counter
    pin:
      number: GPIO2
    name: ${friendly_name} Fan Speed
    id: fan_pulse
    unit_of_measurement: 'RPM'
    filters:
      - multiply: 0.5
    count_mode:
      rising_edge: INCREMENT
      falling_edge: DISABLE
    update_interval: 30s

########################################################
# START THE FAN CONTROLLER SETUP


  # GET TEMP/HUMIDITY FROM DHT11
  - platform: dht
    pin: GPIO23
    model: DHT11
    temperature:
      name: "Temperature"
      id: rack_fan_temperature
      accuracy_decimals: 3
      on_value_range:
        - above: 50.0
          then:
            if:
              condition:
                fan.is_off: rack_fan_toggle
              then:
              - logger.log: "Set fan level 100 over 50C"
              - output.set_level:
                  id: rack_fan_speed
                  level: 100%
        - above: 40.0
          then:
            if:
              condition:
                fan.is_off: rack_fan_toggle
              then:
              - logger.log: "Set fan level 66 over 40C"
              - output.set_level:
                  id: rack_fan_speed
                  level: 66%
        - above: 30.0
          then:
            if:
              condition:
                fan.is_off: rack_fan_toggle
              then:
              - logger.log: "Set fan level 33 over 30C"
              - output.set_level:
                  id: rack_fan_speed
                  level: 33%
        - below: 30.0
          then:
            if:
              condition:
                fan.is_off: rack_fan_toggle
              then:
              - logger.log: "Set fan level 0 under 30C"
              - output.set_level:
                  id: rack_fan_speed
                  level: 0%


    humidity:
      name: "Humidity"
      id: rack_fan_humidity

    update_interval: 2s


output:
  # Wire this pin (15) into the PWM pin of your 12v fan
  # ledc is the name of the pwm output system on an esp32
  - platform: ledc
    id: rack_fan_speed
    pin: GPIO1

    # 25KHz is standard PC fan frequency, minimises buzzing
    frequency: "25000 Hz"

    # my fans stop working below 13% powerful.
    # also they're  powerful and loud, cap their max speed to 80%
    min_power: 1%
    max_power: 100%


fan:
  - platform: speed
    output: rack_fan_speed
    name: ${friendly_name} Override Enable
    id: rack_fan_toggle
    on_turn_on:
     - output.set_level:
          id: rack_fan_speed
          level: !lambda |-
             return id(fan_speed_override).state/100.0;
    on_turn_off:
      - logger.log: "Power of Fan turned OFF"
      - delay: 1s
      - output.set_level:
          id: rack_fan_speed
          level: !lambda |-
            if (id(rack_fan_temperature).raw_state > 50){
              return 1;}
            else if (id(rack_fan_temperature).raw_state > 40){
              return 0.66;}
            else if (id(rack_fan_temperature).raw_state > 30){
              return 0.33;}
            else
              return 0;



number:
  - platform: template
    name: "Fan Speed Override"
    id: fan_speed_override
    internal: false
    max_value: 100.0
    min_value: 0.0
    step: 33.3
    optimistic: true
    mode: slider
    on_value:
      then:
        if:
          condition:
            fan.is_on: rack_fan_toggle
          then:
          - output.set_level:
              id: rack_fan_speed
              level: !lambda "return x/100;"
