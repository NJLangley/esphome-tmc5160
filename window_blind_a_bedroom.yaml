# use 'esphome window_blind_gym.yaml compile' to build.
substitutions:
  device_name: a-bedroom-window-blind
  friendly_name: A Bedroom Window Blind
  node_name: a_bedroom_window_blind
  wifi_static_ip: !secret wifi_static_ip_a_bedroom_window_blind
  closed_position: '4400'
  opening_clutch_backlash_adjustment: '0'


packages:
  # Board specific packages
  board: !include packages/board_esp8266_d1_mini.yaml
  stepper: !include
    file: packages/tmc5160_stepper_esp8266_d1_mini.yaml
    vars:
      # motor_max_speed: '20'
      # motor_acceleration: '500'
      # motor_deceleration: '500'

      # Pancake NEMA17
      motor_max_speed: '1000'
      motor_acceleration: '2000'
      motor_deceleration: '2000'
      
      # Big NEMA17
      # motor_max_speed: '5000'
      # motor_acceleration: '4000'
      # motor_deceleration: '4000'
  
  # Functionallity packages
  roller_blind: !include packages/roller_blind.yaml
  
  # Boilerplate packages
  wifi: !include packages/wifi_static_ip.yaml
  ota: !include packages/ota.yaml
  uptime_sensor: !include packages/uptime_sensor.yaml

logger:
  level: VERBOSE